<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,user-scalable=no,initial-scale=1">
    <link rel="stylesheet" href="/css/style.css">
    <link rel="icon" href="/icons/128x128.png">
    <title>Menu</title>
  </head>
  <body>
    <header>Bienvenido</header>
    <main>
			<div class="flex-box">
				<section id="options">

					<div class="item btn" onclick='hKeyDown({key: "Enter"})' tabIndex="1">&nbsp;2. Cambiar</div>

				<section><img id="vaso" src="/img/vaso-normal.svg"></section>
			</div>
      <section id="days" class="sqrs">
				<div id="L" class="squ">L</div>
				<div id="M" class="squ">M</div>
				<div id="I" class="squ">I</div>
				<div id="J" class="squ">J</div>
				<div id="V" class="squ">V</div>
				<div id="S" class="squ">S</div>
				<div id="D" class="squ">D</div>
      </section>
      <section id="totals" class="sqrs">
				<div id="vasos" class="squ">Vasos:&nbsp;</div>
				<div id="pesos" class="squ">Pesos: $</div>
      </section>

  <script src="/js/script.js"></script>
